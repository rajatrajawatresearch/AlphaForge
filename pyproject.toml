[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaforge"
version = "0.1.0"
description = "Advanced AI-powered stock market trading bot for Indian markets"
requires-python = ">=3.12"
dependencies = [
    "kiteconnect>=5.0.1",
    "pandas>=2.2",
    "pandas-ta>=0.4.67b0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "dash>=2.17",
    "plotly>=5.22",
    "anthropic>=0.89",
    "feedparser>=6.0",
    "aiohttp>=3.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
alphaforge = "alphaforge.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
